services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: evo
      POSTGRES_DB: evo
    volumes:
      - evo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evo -d evo"]
      interval: 3s
      timeout: 3s
      retries: 30

  bootstrap:
    build: .
    environment:
      DATABASE_URL: postgresql://evo:evo@postgres:5432/evo
      NODE_ENV: production
    command: >
      sh -c "node dist/scripts/migrate.js &&
             node dist/scripts/seed-demo.js"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://evo:evo@postgres:5432/evo
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["node","dist/apps/worker/src/main.js"]
    environment:
      DATABASE_URL: postgresql://evo:evo@postgres:5432/evo
      NODE_ENV: production
      LOG_LEVEL: info
      WORKER_POLL_INTERVAL_MS: 1000
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  evo_postgres:
