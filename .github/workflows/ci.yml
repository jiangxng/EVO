name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://evo:evo@localhost:5432/evo
      NODE_ENV: test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: npm install
      - run: npm run validate:docs
      - run: npm run migrate
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run seed:demo
      - run: npm run validate:demo
      - run: npm run validate:eel-c01-receipt-posting
      - run: npm run validate:worker-activation-concurrency
      - run: npm run validate:activation-crash-retry
      - run: npm run validate:activation-failure-matrix
