name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: evo-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.20.0'
  DATABASE_URL: postgres://evo:evo@localhost:5432/evo
  NODE_ENV: test
  LOG_LEVEL: silent

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate certification manifest
        run: node scripts/validate-ci-certification-manifest.mjs
      - id: plan
        name: Emit isolated certification matrix
        run: echo "matrix=$(node scripts/ci-certification-plan.mjs)" >> "$GITHUB_OUTPUT"

  quality:
    name: quality
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run validate:ci-manifest
      - run: npm run validate:docs
      - run: npm run migrate
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run seed:demo
      - run: npm run ci:baseline

  certification:
    name: certification / ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run seed:demo
      - name: Run ${{ matrix.id }}
        run: npm run ${{ matrix.script }}

  migration-upgrade:
    name: migration-upgrade
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run validate:migration-upgrade

  production-artifact:
    name: production-artifact
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build --tag "evo-ci:${GITHUB_SHA}" .
      - name: Migrate and seed through production image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e NODE_ENV=production \
            "evo-ci:${GITHUB_SHA}" \
            node dist/scripts/migrate.js
          docker run --rm --network host \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e NODE_ENV=production \
            "evo-ci:${GITHUB_SHA}" \
            node dist/scripts/seed-demo.js
      - name: Smoke API and worker from production image
        run: |
          set -euo pipefail
          image="evo-ci:${GITHUB_SHA}"
          api_id=""
          worker_id=""
          cleanup() {
            if [ -n "${worker_id}" ]; then docker rm -f "${worker_id}" >/dev/null 2>&1 || true; fi
            if [ -n "${api_id}" ]; then docker rm -f "${api_id}" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          api_id=$(docker run -d --network host \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e NODE_ENV=production \
            -e LOG_LEVEL=silent \
            "${image}")

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health/ready > /tmp/evo-ready.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" -ne 1 ]; then
            docker logs "${api_id}" || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:3000/health/live > /tmp/evo-live.json
          grep -q '"status":"ok"' /tmp/evo-live.json
          grep -q '"status":"ready"' /tmp/evo-ready.json

          worker_id=$(docker run -d --network host \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e NODE_ENV=production \
            -e LOG_LEVEL=silent \
            -e WORKER_POLL_INTERVAL_MS=200 \
            "${image}" \
            node dist/apps/worker/src/main.js)
          sleep 3
          if [ "$(docker inspect -f '{{.State.Running}}' "${worker_id}")" != "true" ]; then
            docker logs "${worker_id}" || true
            exit 1
          fi

  gate:
    name: gate
    if: always()
    needs:
      - plan
      - quality
      - certification
      - migration-upgrade
      - production-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every CI lane
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CERTIFICATION_RESULT: ${{ needs.certification.result }}
          MIGRATION_UPGRADE_RESULT: ${{ needs.migration-upgrade.result }}
          PRODUCTION_ARTIFACT_RESULT: ${{ needs.production-artifact.result }}
        run: |
          set -euo pipefail
          for result in \
            "${PLAN_RESULT}" \
            "${QUALITY_RESULT}" \
            "${CERTIFICATION_RESULT}" \
            "${MIGRATION_UPGRADE_RESULT}" \
            "${PRODUCTION_ARTIFACT_RESULT}"
          do
            if [ "${result}" != "success" ]; then
              echo "Required CI lane did not succeed: ${result}"
              exit 1
            fi
          done
